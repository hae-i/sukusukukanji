name: sukusukukanji
description: 한국어와 연결하며 한 학년씩 자라는 일본어 한자 학습 앱.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.3
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/data/grades.json
    - assets/data/kanji/grade1.json
